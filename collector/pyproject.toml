[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar"
version = "0.1.0"
description = "Global Opportunity Radar - coletor, motor de elegibilidade e worker"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pypdf>=4",
  "feedparser>=6",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: precisa de PostgreSQL real (RADAR_TEST_DATABASE_URL)",
  "e2e: ponta a ponta com fixtures (rotuladas como TESTE)",
]
addopts = "-q"
